name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Don't fail build on lint warnings initially

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          CI: true

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Expo build
        run: npx expo export --platform web --output-dir dist-check
        env:
          # Dummy env vars for build check (not real credentials)
          EXPO_PUBLIC_FIREBASE_API_KEY: 'build-check'
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: 'build-check'
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: 'build-check'
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: 'build-check'
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 'build-check'
          EXPO_PUBLIC_FIREBASE_APP_ID: 'build-check'

  cloud-functions-check:
    name: Cloud Functions Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cloud Functions dependencies
        working-directory: ./cloud-functions
        run: npm ci

      - name: Lint Cloud Functions
        working-directory: ./cloud-functions
        run: npm run lint --if-present
        continue-on-error: true
